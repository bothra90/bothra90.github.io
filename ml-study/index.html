const COURSE=Object.fromEntries(DATA.courses.map(c=>[c.id,c]));

let S=load();
function load(){try{const x=JSON.parse(localStorage.getItem(K));return x&&typeof x==='object'?{...INITIAL,...x}:structuredClone(INITIAL)}catch(e){return structuredClone(INITIAL)}}

function findRevisit(q){if(q.lessonId&&LESSON[q.lessonId])return LESSON[q.lessonId];const ls=DATA.lessons.filter(l=>l.course===q.course);const tok=(q.skill+' '+q.question).toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3&&!['what','when','does','from','explain','derive','with','this','that','under','into','prove','which'].includes(w));let best=ls[0],bs=-1;for(const l of ls){let title=l.title.toLowerCase();let s=tok.reduce((a,w)=>a+(title.includes(w)?1:0),0);if(s>bs){best=l;bs=s}}return best}

function overview(){let total=DATA.lessons.length,completedCount=DATA.lessons.filter(l=>done(l.id)).length,w=currentWeek(),cw=DATA.weeks[w-1],graded=Object.keys(S.quiz).length,weak=gaps().length;return `<div class="grid-stats"><div class="stat"><div class="stat-label">Lecture progress</div><div class="stat-value">${pct(completedCount,total)}%</div><div class="stat-foot">${nfmt(completedCount)} of ${nfmt(total)} lectures</div></div><div class="stat"><div class="stat-label">Current week</div><div class="stat-value">${w}<span style="font-size:16px;color:#8894a5"> / ${DATA.weeks.length}</span></div><div class="stat-foot">${weekDate(w)} · ${stageLabel(cw.stage)}</div></div><div class="stat"><div class="stat-label">Lecture time completed</div><div class="stat-value">${Math.round(DATA.lessons.filter(l=>done(l.id)).reduce((s,l)=>s+l.minutes,0)/60)}h</div><div class="stat-foot">Of ${Math.round(DATA.lessons.reduce((s,l)=>s+l.minutes,0)/60)} estimated hours</div></div><div class="stat"><div class="stat-label">Review queue</div><div class="stat-value">${weak}</div><div class="stat-foot">${graded} quiz responses assessed</div></div></div><div class="main-grid"><div><div class="panel"><div class="section-head"><div><div class="step">Up next · Week ${w}</div><h2>${stageLabel(cw.stage)}</h2><p>${fmt(cw.minutes)} planned lectures · ${cw.lessonIds.length} videos · target 10 hours</p></div><button class="btn tiny primary" data-page="focus">Open study plan →</button></div>${cw.courseIds.map(cid=>{let items=cw.lessonIds.filter(id=>LESSON[id].course===cid);return `<div class="course-mini">${chip(cid)}<div class="course-hline"><small>${items.filter(id=>done(id)).length}/${items.length} lectures this week</small><small>${fmt(items.reduce((s,id)=>s+LESSON[id].minutes,0))}</small></div>${progressBar(pct(items.filter(id=>done(id)).length,items.length),COURSE[cid].color)}</div>`}).join('')}<div class="spacer"></div>${cw.lessonIds.slice(0,4).map(id=>lessonCard(LESSON[id],true)).join('')}<div class="spacer"></div><button class="btn" data-page="weeks">View all weekly lectures</button></div></div><div><div class="panel"><div class="section-head"><div><h2>Adaptive pacing</h2><p>Your plan reflects completed lectures and self-assessed quiz results.</p></div><span class="pill purple">${suggestedPace().hours}h target</span></div><div class="callout">${esc(suggestedPace().reason)} Current week unfinished lectures are always prioritized. Quizzes below 65% reduce the next video recommendation, preserving study time for remediation.</div><div class="spacer"></div><button class="btn secondary" data-page="focus">See next lecture sequence →</button></div><div class="panel"><div class="section-head"><div><h2>Learning tracks</h2><p>${DATA.courses.length} university/curated tracks across eight phases</p></div></div>${cw.courseIds.map(cid=>`<div class="course-mini">${chip(cid)}<div class="course-hline"><small>${courseTotals(cid)}</small><small>${coursePct(cid)}%</small></div>${progressBar(coursePct(cid),COURSE[cid].color)}</div>`).join('')}<div class="spacer"></div><button class="btn" data-page="courses">Browse all courses →</button></div></div></div><div class="spacer"></div><div class="callout warning">The <strong>10 hours/week budget covers lecture viewing only.</strong> Problem sets, quiz writing, and project work typically add 6–12+ hours per week. All runtimes are planning estimates, not verified video lengths.</div>`}
function focus(){let arr=adaptiveLessons(),cw=currentWeek(),w=DATA.weeks[cw-1],rec=suggestedPace(),minutes=arr.reduce((s,l)=>s+l.minutes,0),remain=w.lessonIds.filter(id=>!done(id)).length;return `<div class="grid-stats"><div class="stat"><div class="stat-label">Recommended lectures</div><div class="stat-value">${arr.length}</div><div class="stat-foot">${fmt(minutes)} scheduled</div></div><div class="stat"><div class="stat-label">Adaptive budget</div><div class="stat-value">${rec.hours}h</div><div class="stat-foot">Base setting ${S.target} hours</div></div><div class="stat"><div class="stat-label">Current syllabus week</div><div class="stat-value">${cw}</div><div class="stat-foot">${remain} items outstanding</div></div><div class="stat"><div class="stat-label">Active study tracks</div><div class="stat-value">${w.courseIds.length}</div><div class="stat-foot">Two continuous study streams</div></div></div><div class="main-grid"><div><div class="panel"><div class="section-head"><div><h2>Your next lecture queue</h2><p>${esc(rec.reason)}</p></div><span class="pill purple">${fmt(minutes)} video</span></div>${arr.length?arr.map(l=>lessonCard(l)).join('<div style="height:8px"></div>'):'<div class="empty">You have completed all lectures in these tracks. Open the curriculum to explore further.</div>'}<div class="spacer"></div><button class="btn primary" data-page="quiz">Take this week's quiz →</button></div></div><div class="sticky-side">${resourcePanel(w)}<div class="spacer"></div><div class="panel"><h2 style="font-size:16px;margin-top:0">How adaptation works</h2><p class="helper">The recommended lecture queue is reconstructed from the first unfinished week across both study streams. Incomplete lectures carry forward. A recent weak quiz reduces the next target by 2 hours and creates review links. A strong quiz can increase it by 1 hour. The complete original syllabus is never deleted or reordered.</p><p class="smallprint">This is a local rules-based planner, not an AI tutor: it cannot assess the correctness of your written proofs automatically.</p></div></div></div>`}
function syllabus(){const w=DATA.weeks[S.selectedWeek-1]||DATA.weeks[0];const weekPct=pct(completed(w),w.lessonIds.length);return `<div class="panel"><div class="section-head"><div><h2>Full ${DATA.weeks.length}-week schedule</h2><p>Open any week to see its lecture list and materials.</p></div><span class="pill">${DATA.lessons.length} lecture entries</span></div><div class="weeks-grid">${DATA.weeks.map(x=>`<button class="week-tile ${w.id===x.id?'selected':''}" data-week="${x.id}"><strong>Week ${x.id} ${allDone(x)?'✓':''}</strong><small>${esc(stageLabel(x.stage))}</small>${progressBar(pct(completed(x),x.lessonIds.length))}<small>${completed(x)}/${x.lessonIds.length} done · ${fmt(x.minutes)} videos</small></button>`).join('')}</div></div><div class="spacer"></div>${weekDetail(w)}`}
function weekDetail(w){let pp=pct(completed(w),w.lessonIds.length);return `<div class="main-grid"><div><div class="panel"><div class="section-head"><div><div class="step">Week ${w.id} · starts ${weekDate(w.id)}</div><h2>${esc(stageLabel(w.stage))}</h2><p>${fmt(w.minutes)} estimated new lectures ${w.reviewMinutes?`+ ${fmt(w.reviewMinutes)} optional lecture review to approach 10h`:''}</p></div>${weekSelector(w.id)}</div>${progressBar(pp)}<p class="smallprint" style="margin:9px 0 18px">${completed(w)}/${w.lessonIds.length} lectures complete · ${pp}%</p>${w.courseIds.map(cid=>{let ids=w.lessonIds.filter(id=>LESSON[id].course===cid);return `<div class="course-panel">${chip(cid)}<div style="height:10px"></div><div class="lecture-list">${ids.length?ids.map(id=>lessonCard(LESSON[id])).join(''):'<div class="helper">Course finishes during the phase transition.</div>'}</div></div>`}).join('')}<div class="spacer"></div><button class="btn primary" data-page="quiz">Quiz for week ${w.id} →</button></div></div><div class="sticky-side">${resourcePanel(w)}<div class="spacer"></div><div class="panel"><div class="section-head"><div><h2>Personal notes</h2><p>Saved in your browser</p></div></div><textarea class="notebox" data-week-note="${w.id}" placeholder="Write derivations, observations, confusing concepts, and follow-up questions here…">${esc(S.notes[w.id]||'')}</textarea></div></div></div>`}
function quiz(){const w=DATA.weeks[S.selectedWeek-1]||DATA.weeks[currentWeek()-1],a=assessedQuestions(w);return `<div class="panel"><div class="section-head"><div><h2>Week ${w.id} · Mastery quiz</h2><p>${esc(stageLabel(w.stage))} · ${w.quiz.length} written, proof-oriented questions</p></div>${weekSelector(w.id)}</div><div class="callout"><strong>How to use:</strong> write an answer before opening the worked benchmark, then score yourself 0 (gap), 1 (partial), or 2 (confident). Weak answers generate specific lesson recommendations. No external AI judges your mathematics.</div>${w.quiz.map((q,i)=>`<div class="qa"><div class="cardline"><span class="pill">Question ${i+1} of ${w.quiz.length}</span>${chip(q.course)}</div><h3>${esc(q.question)}</h3><textarea data-answer="${esc(q.id)}" placeholder="Work through the proof or derivation, including assumptions…">${esc(S.answers[q.id]||'')}</textarea><div class="toolbar" style="margin-top:9px"><button class="btn tiny secondary" data-action="reveal" data-q="${esc(q.id)}">${S.reveal[q.id]?'Hide benchmark':'Reveal benchmark'}</button></div>${S.reveal[q.id]?`<div class="solution"><strong>Expected core reasoning</strong><p>${esc(q.answer)}</p></div><div class="rating-row"><span class="helper">Score understanding:</span>${[0,1,2].map(n=>`<button data-score="${esc(q.id)}" data-value="${n}" class="${S.quiz[q.id]===n?'selected':''}">${['0 · Gap','1 · Partial','2 · Mastered'][n]}</button>`).join('')}</div>`:''}</div>`).join('')}${a.graded?`<div class="quiz-score"><strong>Quiz score: ${a.score}%</strong> · ${a.graded}/${a.total} questions assessed.${a.score<75?' Review the missed concepts before moving on.':' Good progress — still complete the weekly problem sets.'}</div>`:''}<div class="spacer"></div><button class="btn" data-page="reviews">See targeted review →</button></div>`}
function catalog(){return `<div class="panel"><div class="section-head"><div><h2>Courses organized by prerequisite stage</h2><p>These are university courses and course-linked lecture outlines; some companion tracks are curated.</p></div></div>${DATA.pairs.map((pair,i)=>`<div class="step" style="margin-top:${i?25:5}px">PHASE ${i+1} — ${stageLabel(i+1)}</div><div class="course-list-grid">${pair.map(cid=>{let co=COURSE[cid];return `<div class="course-card"><div class="cardline">${chip(cid)}<span class="pill">${coursePct(cid)}%</span></div><p>${esc(co.school)}</p>${progressBar(coursePct(cid),co.color)}<div class="course-hline"><small>${courseTotals(cid)}</small><small>~${Math.round(co.topics.length*co.minutes/60)} hours</small></div><div class="resource-line">${link(co.video,'University video list / series')}${link(co.assign,'Assignments / problem sets')}${link(co.reading,'Notes / other reading')}</div><p class="smallprint">${esc(co.pdfnote)}</p></div>`}).join('')}</div>`).join('')}</div>`}
function review(){let gg=gaps();return `<div class="main-grid"><div><div class="panel"><div class="section-head"><div><h2>${gg.length} concepts to revisit</h2><p>Based on questions you self-scored as gap or partial.</p></div></div>${gg.length?gg.map(q=>{let l=findRevisit(q);return `<div class="topic-row"><div class="cardline"><strong>${esc(q.skill)}</strong><span class="pill ${q.score===0?'yellow':'purple'}">${q.score===0?'Gap':'Partial'}</span></div><p>Week ${q.week} · ${esc(COURSE[q.course].name)} · ${esc(q.question)}</p><div class="resource-line">${link(l.video,`Revisit lecture ${l.order}: ${l.title}`)}${link(COURSE[q.course].reading,'Re-read university reference notes')}${link(COURSE[q.course].assign,'Redo practice / assignment exercises')}</div><button class="btn tiny" data-page="quiz" data-week-for-quiz="${q.week}">Retry week ${q.week} quiz</button></div>`}).join(''):'<div class="empty">No gaps identified yet. Complete a weekly quiz and self-grade answers to build your review queue.</div>'}</div></div><div class="sticky-side"><div class="panel"><h2 style="margin-top:0;font-size:17px">Review protocol</h2><ol class="helper" style="padding-left:20px"><li>Rewatch the suggested lecture or open the university notes.</li><li>Redo the related derivation without looking at the answer.</li><li>Attempt the hardest relevant university assignment problem.</li><li>Return to the quiz and update your self-score.</li></ol><p class="smallprint">Lesson matching is keyword based. For subtle conceptual gaps, inspect the official lecture index and select the most relevant class.</p></div></div></div>`}
function settings(){return `<div class="main-grid"><div><div class="panel"><div class="section-head"><div><h2>Planning preferences</h2><p>These change your adaptive lecture suggestions, not the preserved base curriculum.</p></div></div><div class="formrow"><label>Start date (Monday recommended)<input type="date" id="start-date" value="${esc(S.start)}"/></label><label>Base weekly lecture hours<input type="number" id="target-hours" min="5" max="18" step="1" value="${esc(S.target)}"/></label></div><div class="spacer"></div><label class="helper"><input id="auto-pace" type="checkbox" ${S.auto?'checked':''}/> Automatically adapt from quizzes and progress</label><div class="spacer"></div><button class="btn primary" data-action="save-settings">Save settings</button></div><div class="panel"><div class="section-head"><div><h2>Export / import / reset</h2><p>Your records are stored only on this device and browser profile.</p></div></div><div class="toolbar"><button class="btn" data-action="export">Download JSON backup</button><button class="btn" data-action="import">Import backup</button><button class="btn" data-action="csv">Export syllabus CSV</button><button class="btn" data-action="print">Print</button></div><p class="smallprint">Importing merges new backup progress into your current plan, using the same course IDs. There is no cloud sync or account login.</p><div class="spacer"></div><button class="btn" data-action="reset">Reset all progress…</button></div></div><div class="sticky-side"><div class="panel"><h2 style="margin-top:0;font-size:17px">About this tracker</h2><p class="helper">Self-contained HTML application, works offline after download except for external lecture/reference links. All lectures and quizzes are preloaded. The recommendation engine follows a local rule set; it does not generate new mathematical explanations using a hosted language model.</p><p class="helper">Time estimates are approximate. Source indexes were verified when the plan was prepared; availability of third-party videos or restricted assignment materials can change.</p><p class="helper">Every original weekly syllabus stays intact, and the adaptive view dynamically prioritizes unfinished videos while reducing or expanding the next target according to quiz performance.</p></div></div></div>`}
function render(){S.selectedWeek=Math.min(DATA.weeks.length,Math.max(1,Number(S.selectedWeek)||currentWeek()));let page=titles[S.page]?S.page:'dashboard';document.querySelectorAll('[data-page].nav').forEach(el=>el.classList.toggle('active',el.dataset.page===page));document.getElementById('page-title').textContent=titles[page][0];document.getElementById('page-description').textContent=titles[page][1];document.getElementById('eyebrow').textContent='RIGOROUS ML · '+DATA.weeks.length+'-WEEK CURRICULUM';document.getElementById('today-date').textContent=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});document.getElementById('side-stat').textContent=`${DATA.lessons.filter(x=>done(x.id)).length} / ${DATA.lessons.length} lectures`;
let content=({dashboard:overview,focus:focus,weeks:syllabus,quiz:quiz,courses:catalog,reviews:review,settings:settings})[page]();document.getElementById('page-content').innerHTML=content;}
function download(name,text,type){let blob=new Blob([text],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csv(){let rows=[['Week','Phase','Course','Lecture','Estimated minutes','Video URL','Official course index','Exercise source URL']];for(let w of DATA.weeks){for(let id of w.lessonIds){let l=LESSON[id],c=COURSE[l.course];rows.push([w.id,stageLabel(w.stage),c.name,l.title,l.minutes,l.video,l.index,c.assign])}}return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function action(name,el){if(name==='prev-week'){S.selectedWeek=Math.max(1,S.selectedWeek-1);save();render()}if(name==='next-week'){S.selectedWeek=Math.min(DATA.weeks.length,S.selectedWeek+1);save();render()}if(name==='export'){download('ml-study-progress-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),progress:S},null,2),'application/json')}if(name==='csv'){download('ml-curriculum-weeks.csv',csv(),'text/csv;charset=utf-8')}if(name==='import'){document.getElementById('import-file').click()}if(name==='print'){window.print()}if(name==='reveal'){let id=el.dataset.q;S.reveal[id]=!S.reveal[id];save();render()}if(name==='save-settings'){S.start=document.getElementById('start-date').value||'2026-11-02';S.target=Math.min(18,Math.max(5,Number(document.getElementById('target-hours').value)||10));S.auto=document.getElementById('auto-pace').checked;save();render()}if(name==='reset'){if(confirm('Permanently clear your lecture checks, quiz answers, scores, and notes from this browser? Export a backup first.')){S=structuredClone(INITIAL);save();render()}}}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){if(p.dataset.weekForQuiz)S.selectedWeek=Number(p.dataset.weekForQuiz);go(p.dataset.page);return}const w=e.target.closest('[data-week]');if(w){S.selectedWeek=Number(w.dataset.week);save();render();document.querySelector('.main-grid')?.scrollIntoView({behavior:'smooth',block:'start'});return}const sc=e.target.closest('[data-score]');if(sc){S.quiz[sc.dataset.score]=Number(sc.dataset.value);save();render();return}const b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b)});
document.addEventListener('change',e=>{if(e.target.matches('[data-lesson]')){S.completed[e.target.dataset.lesson]=e.target.checked;save();render()}else if(e.target.id==='week-select'){S.selectedWeek=Number(e.target.value);save();render()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-answer]')){S.answers[e.target.dataset.answer]=e.target.value;save()}else if(e.target.matches('[data-week-note]')){S.notes[e.target.dataset.weekNote]=e.target.value;save()}});
document.getElementById('import-file').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let j=JSON.parse(await f.text()),p=j.progress;if(!p||typeof p.completed!=='object'||typeof p.quiz!=='object')throw Error('Not a valid First Principles backup');S={...S,...p,completed:{...S.completed,...p.completed},quiz:{...S.quiz,...p.quiz},answers:{...S.answers,...p.answers},notes:{...S.notes,...p.notes},reveal:{...S.reveal,...p.reveal}};save();render();alert('Backup imported successfully.')}catch(err){alert('Could not import: '+err.message)}finally{e.target.value=''}});
render();
</script>
</body></html>
